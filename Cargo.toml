[package]
name = "aurora"
version = "0.3.0"
edition = "2021"

[dependencies]
wry = { version = "0.50", features = ["devtools"] }
tao = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
