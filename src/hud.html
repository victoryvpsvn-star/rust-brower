<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>FPS</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body { font: 600 11px ui-monospace, "Cascadia Mono", Consolas, monospace;
    display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
  #hud { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px;
    border-radius: 10px; background: rgba(10, 12, 18, .58);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 18px rgba(0,0,0,.35); cursor: default; }
  #n { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -.5px;
    color: #37d67a; text-shadow: 0 0 14px currentColor; transition: color .3s; }
  #u { font-size: 9.5px; color: rgba(255,255,255,.6); letter-spacing: 1.5px; }
  #hud.mid #n { color: #38c6ff; }
  #hud.low #n { color: #ffb84d; }
  #hud.bad #n { color: #ff5c6c; }
</style>
</head>
<body>
  <div id="hud"><span id="n">—</span><span id="u">FPS</span></div>
  <script>
    window.__fps = function (n) {
      var hud = document.getElementById('hud'), el = document.getElementById('n');
      el.textContent = (n > 0) ? n : '—';
      hud.className = n >= 110 ? '' : n >= 55 ? 'mid' : n >= 28 ? 'low' : 'bad';
    };
  </script>
</body>
</html>
