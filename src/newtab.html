<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab mới</title>
<style>
  :root { --text: #eef0ff; --mut: rgba(238,240,255,.55); --glass: rgba(255,255,255,.07); --line: rgba(255,255,255,.12); --a1: #8b7bff; --a2: #5eb8ff; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --text: #1a1c26; --mut: rgba(26,28,38,.55); --glass: rgba(255,255,255,.7); --line: rgba(0,0,0,.1); --a1: #6c5cf0; --a2: #2f8ff0; color-scheme: light; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: grid; place-items: center; color: var(--text); font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1100px 650px at 15% 0%, color-mix(in srgb, var(--a1) 30%, transparent), transparent 60%),
                radial-gradient(900px 600px at 90% 100%, color-mix(in srgb, var(--a2) 25%, transparent), transparent 55%), #12131a; }
  @media (prefers-color-scheme: light) { body { background-color: #f1f2f8; } }
  main { width: min(660px, 90vw); text-align: center; animation: in .5s ease-out; }
  #clock { font-size: 76px; font-weight: 200; letter-spacing: -3px; line-height: 1; }
  #date { margin: 8px 0 34px; color: var(--mut); }
  input { width: 100%; height: 54px; padding: 0 24px; border-radius: 27px; border: 1px solid var(--line); background: var(--glass); color: inherit; font: inherit; font-size: 16px; outline: none; backdrop-filter: blur(14px); transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: var(--mut); }
  input:focus { border-color: var(--a1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--a1) 28%, transparent); }
  .tiles { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 38px; min-height: 100px; }
  .tile { width: 96px; padding: 14px 6px 12px; border-radius: 16px; display: grid; justify-items: center; gap: 9px; color: inherit; text-decoration: none; font-size: 12.5px; transition: background .15s, transform .12s; }
  .tile:hover { background: var(--glass); transform: translateY(-3px); }
  .tile .i { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; font-weight: 700; font-size: 19px; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); }
  .tile .i img { width: 46px; height: 46px; object-fit: contain; background: #fff; padding: 9px; }
  .tile span { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--mut); }
  .tip { margin-top: 30px; color: var(--mut); font-size: 12.5px; }
  .tip kbd { font: 11.5px ui-monospace, monospace; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--glass); }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main>
  <div id="clock"></div>
  <div id="date"></div>
  <form id="f"><input id="q" autofocus autocomplete="off" spellcheck="false" placeholder="Tìm kiếm hoặc nhập địa chỉ web"></form>
  <div class="tiles" id="tiles"></div>
  <div class="tip"><kbd>Ctrl</kbd> <kbd>K</kbd> thanh địa chỉ · gõ <kbd>&gt;</kbd> xem lệnh · <kbd>!g</kbd> <kbd>!yt</kbd> <kbd>!gh</kbd> tìm nhanh</div>
</main>
<script>
  const clock = document.getElementById('clock'), date = document.getElementById('date');
  function tick() {
    const d = new Date();
    clock.textContent = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    date.textContent = d.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  tick(); setInterval(tick, 10000);

  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('q').value.trim();
    if (v) window.ipc.postMessage('nav|' + v);
  });

  const DEFAULTS = [
    ['Google', 'https://www.google.com'], ['YouTube', 'https://www.youtube.com'],
    ['GitHub', 'https://github.com'], ['Wikipedia', 'https://vi.wikipedia.org'], ['Rust', 'https://www.rust-lang.org']
  ];
  function tile(title, url) {
    const a = document.createElement('a');
    a.className = 'tile'; a.href = url;
    let h = url; try { h = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
    const i = document.createElement('div'); i.className = 'i';
    const letter = (title || h || '?').trim()[0].toUpperCase();
    const img = new Image(); img.src = new URL(url).origin + '/favicon.ico';
    img.onerror = () => { img.remove(); i.textContent = letter; };
    i.appendChild(img);
    const s = document.createElement('span'); s.textContent = title || h;
    a.append(i, s);
    return a;
  }
  function draw(list) {
    const t = document.getElementById('tiles'); t.replaceChildren();
    list.slice(0, 10).forEach(([ti, u]) => { try { t.appendChild(tile(ti, u)); } catch (e) {} });
  }
  draw(DEFAULTS);
  window.__home = (d) => {
    const seen = new Set(), out = [];
    for (const x of [...d.bms, ...d.top]) { if (!seen.has(x.url)) { seen.add(x.url); out.push([x.title, x.url]); } }
    draw(out.length ? out : DEFAULTS);
  };
</script>
</body>
</html>
