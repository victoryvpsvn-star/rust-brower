<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --sw: 248px; --top: 52px; --pill: 560px;
    --bg: #14151a; --hover: #23252f; --act: #2c2f3d; --text: #eceef6; --mut: #8a8fa3;
    --line: #262833; --a1: #8b7bff; --a2: #5eb8ff; --field: #0e0f13;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #e9ebf2; --hover: #dde0ea; --act: #ffffff; --text: #1a1c26; --mut: #6a7086;
      --line: #d3d6e2; --a1: #6c5cf0; --a2: #2f8ff0; --field: #ffffff; color-scheme: light; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Sidebar ---------- */
  #side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sw); padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 6px; }
  .logo { width: 22px; height: 22px; border-radius: 7px; flex: none; background: conic-gradient(from 210deg, var(--a1), var(--a2), var(--a1)); box-shadow: 0 2px 10px color-mix(in srgb, var(--a1) 45%, transparent); }
  .brand b { font-size: 14px; letter-spacing: .2px; flex: 1; }
  .ibtn { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--mut); transition: background .15s, color .15s, transform .08s; }
  .ibtn:hover { background: var(--hover); color: var(--text); }
  .ibtn:active { transform: scale(.92); }
  .newbtn { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--mut); text-align: left; transition: background .15s, color .15s; }
  .newbtn:hover { background: var(--hover); color: var(--text); }
  .newbtn span { flex: 1; }
  kbd { font: 11px ui-monospace, monospace; color: var(--mut); opacity: .75; }
  .label { padding: 12px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--mut); opacity: .8; display: flex; align-items: center; justify-content: space-between; }
  .label.click { cursor: pointer; }
  .pins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 2px 2px 4px; }
  .pins:empty { display: none; }
  .pin { height: 44px; border-radius: 12px; background: var(--hover); display: grid; place-items: center; cursor: default; position: relative; transition: background .15s, transform .1s; }
  .pin:hover { transform: translateY(-1px); }
  .pin.active { background: var(--act); box-shadow: inset 0 0 0 1.5px var(--a1); }
  .list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; flex: 1 1 auto; scrollbar-width: none; }
  .list::-webkit-scrollbar { display: none; }
  .tab { position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px 0 10px; border-radius: 10px; color: var(--mut); cursor: default; flex: none; transition: background .12s, color .12s; animation: pop .16s ease-out; }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab.active { background: var(--act); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.22); }
  .tab.active::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: linear-gradient(var(--a1), var(--a2)); }
  .tab.drop { box-shadow: inset 0 2px 0 var(--a1); }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; opacity: 0; font-size: 15px; line-height: 1; transition: opacity .12s, background .12s; }
  .tab:hover .x, .tab.active .x { opacity: .65; }
  .tab .x:hover { opacity: 1; background: rgba(128,128,128,.25); }
  .fav { width: 18px; height: 18px; border-radius: 6px; flex: none; display: grid; place-items: center; overflow: hidden; font-size: 10px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); }
  .fav img { width: 18px; height: 18px; object-fit: contain; background: #fff; border-radius: 5px; }
  .fav.spin { background: none; border: 2px solid var(--line); border-top-color: var(--a1); border-radius: 50%; animation: spin .7s linear infinite; }
  .bms { display: flex; flex-direction: column; gap: 1px; max-height: 28vh; overflow-y: auto; scrollbar-width: none; flex: none; }
  .bms .tab { height: 30px; }

  /* ---------- Toolbar ---------- */
  #bar { position: fixed; left: var(--sw); right: 0; top: 0; height: var(--top); display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px; }
  #pillwrap { position: absolute; left: 50%; transform: translateX(-50%); width: var(--pill); }
  #pill { display: flex; align-items: center; height: 36px; border-radius: 18px; padding: 0 6px 0 14px; gap: 8px; background: var(--field); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  #pill:focus-within { border-color: var(--a1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--a1) 28%, transparent); }
  #pill > svg { color: var(--mut); width: 15px; height: 15px; }
  #url { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; user-select: text; -webkit-user-select: text; }
  #url::placeholder { color: var(--mut); }
  #star { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--mut); transition: color .15s, background .15s, transform .15s; }
  #star:hover { background: var(--hover); color: var(--text); }
  #star.on { color: #ffc43d; }
  #star.on svg { fill: #ffc43d; animation: boing .35s; }
  #prog { position: fixed; left: var(--sw); right: 0; top: calc(var(--top) - 2px); height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
  #prog.on { opacity: 1; }
  #prog::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: linear-gradient(90deg, transparent, var(--a1), var(--a2), transparent); animation: slide 1.1s ease-in-out infinite; }

  /* ---------- Thu gọn ---------- */
  body.collapsed .brand b, body.collapsed .newbtn span, body.collapsed .newbtn kbd, body.collapsed .label span,
  body.collapsed .tab .t, body.collapsed .tab .x { display: none; }
  body.collapsed .brand { justify-content: center; padding: 0; }
  body.collapsed .brand .ibtn { display: none; }
  body.collapsed .newbtn, body.collapsed .tab { justify-content: center; padding: 0; }
  body.collapsed .pins { grid-template-columns: 1fr; }
  body.collapsed .label { padding: 8px 0 2px; justify-content: center; }
  body.collapsed .label::after { content: ""; width: 20px; height: 1px; background: var(--line); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }
  @keyframes boing { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<aside id="side">
  <div class="brand">
    <div class="logo"></div><b>Aurora</b>
    <button class="ibtn" id="settings" title="Cài đặt (ảnh nền, tìm kiếm…)" style="margin-left:-2px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.82-.33 1.7 1.7 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.51 1.7 1.7 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .33-1.82 1.7 1.7 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.51-1 1.7 1.7 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.82.33h.01a1.7 1.7 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51h.01a1.7 1.7 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.33 1.82v.01a1.7 1.7 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg></button>
    <button class="ibtn" id="collapse" title="Thu gọn thanh bên (Ctrl+B)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
  </div>
  <button class="newbtn" id="newtab" title="Tab mới (Ctrl+T)">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Tab mới</span><kbd>Ctrl T</kbd>
  </button>
  <div class="pins" id="pins"></div>
  <div class="label"><span>Tab đang mở</span></div>
  <div class="list" id="list"></div>
  <div class="label click" id="bmhead"><span>Đánh dấu</span></div>
  <div class="bms" id="bms"></div>
</aside>

<header id="bar">
  <button class="ibtn" id="back" title="Quay lại (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ibtn" id="fwd" title="Tiến tới (Alt+→)"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button class="ibtn" id="reload" title="Tải lại (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <div id="pillwrap">
    <div id="pill">
      <svg id="pico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Tìm kiếm, nhập địa chỉ, hoặc gõ > để xem lệnh">
      <button id="star" title="Đánh dấu trang (Ctrl+D)"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
    </div>
  </div>
</header>
<div id="prog"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const send = (m) => { try { window.ipc.postMessage(m); } catch (e) {} };
  /*KEYS*/
  window.__aurora_keys(send);

  let S = { tabs: [], active: 0, bms: [], bm: false, collapsed: false };
  let editing = false, bmOpen = true, dragId = null;

  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
  const pretty = (u) => u.replace(/^https?:\/\//, '').replace(/\/$/, '');

  function fav(t) {
    const w = document.createElement('span');
    w.className = 'fav';
    if (t.loading) { w.classList.add('spin'); return w; }
    const letter = ((t.title || host(t.url) || '').trim()[0] || '•').toUpperCase();
    if (!t.url) { w.textContent = '✦'; return w; }
    if (t.icon) {
      const i = new Image();
      i.src = t.icon;
      i.onerror = () => { i.remove(); w.textContent = letter; };
      w.appendChild(i);
    } else w.textContent = letter;
    return w;
  }

  function tabEl(t, idx) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === S.active ? ' active' : '');
    el.title = t.title || t.url;
    el.draggable = true;
    el.appendChild(fav(t));
    const s = document.createElement('span'); s.className = 't'; s.textContent = t.title || host(t.url) || 'Tab mới'; el.appendChild(s);
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'Đóng tab'; el.appendChild(x);
    el.addEventListener('mousedown', (e) => {
      if (e.button === 1) { e.preventDefault(); send('close|' + t.id); }
      else if (e.button === 0 && e.target !== x) send('switch|' + t.id);
    });
    x.addEventListener('click', (e) => { e.stopPropagation(); send('close|' + t.id); });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); send('pin|' + t.id); });
    el.addEventListener('dragstart', () => { dragId = t.id; });
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('drop'); if (dragId != null && dragId !== t.id) send('reorder|' + dragId + '|' + idx); dragId = null; });
    return el;
  }

  function pinEl(t) {
    const el = document.createElement('div');
    el.className = 'pin' + (t.id === S.active ? ' active' : '');
    el.title = (t.title || t.url) + '\nChuột phải: bỏ ghim';
    el.appendChild(fav(t));
    el.addEventListener('mousedown', (e) => { if (e.button === 0) send('switch|' + t.id); });
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); send('pin|' + t.id); });
    return el;
  }

  function render() {
    document.body.classList.toggle('collapsed', !!S.collapsed);
    const pins = $('#pins'), list = $('#list'), bms = $('#bms');
    pins.replaceChildren(); list.replaceChildren(); bms.replaceChildren();
    S.tabs.forEach((t, i) => (t.pinned ? pins : list).appendChild(t.pinned ? pinEl(t) : tabEl(t, i)));

    $('#bmhead').style.display = S.bms.length ? '' : 'none';
    bms.style.display = (S.bms.length && bmOpen) ? '' : 'none';
    for (const b of S.bms) {
      const el = document.createElement('div');
      el.className = 'tab'; el.title = b.url;
      el.appendChild(fav({ url: b.url, title: b.title, icon: '' }));
      const s = document.createElement('span'); s.className = 't'; s.textContent = b.title || host(b.url); el.appendChild(s);
      el.addEventListener('click', () => send('go|' + b.url));
      bms.appendChild(el);
    }

    const cur = S.tabs.find((t) => t.id === S.active);
    if (cur) {
      if (!editing) $('#url').value = cur.url ? pretty(cur.url) : '';
      $('#prog').classList.toggle('on', !!cur.loading);
      $('#pico').innerHTML = cur.url && cur.url.startsWith('https')
        ? '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
        : '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>';
    }
    $('#star').classList.toggle('on', !!S.bm);
  }

  window.__state = (s) => { S = s; render(); };
  window.__layout = (sw, pill, top) => {
    const r = document.documentElement.style;
    r.setProperty('--sw', sw + 'px'); r.setProperty('--pill', pill + 'px'); r.setProperty('--top', top + 'px');
  };
  window.focusUrl = () => { const u = $('#url'); u.focus(); u.select(); };

  $('#newtab').onclick = () => send('act|newtab');
  $('#settings').onclick = () => send('act|settings');
  $('#collapse').onclick = () => send('act|sidebar');
  $('#back').onclick = () => send('act|back');
  $('#fwd').onclick = () => send('act|fwd');
  $('#reload').onclick = () => send('act|reload');
  $('#star').onclick = () => send('act|bookmark');
  $('#bmhead').onclick = () => { bmOpen = !bmOpen; render(); };

  const url = $('#url');
  url.addEventListener('focus', () => { editing = true; url.select(); send('focus|'); });
  url.addEventListener('blur', () => { editing = false; render(); });
  url.addEventListener('input', () => send('typing|' + url.value));
  url.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); send('move|1'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); send('move|-1'); }
    else if (e.key === 'Enter') { e.preventDefault(); send('enter|' + url.value); url.blur(); }
    else if (e.key === 'Escape') { send('esc|'); url.blur(); }
  });

  send('ready|');
</script>
</body>
</html>
