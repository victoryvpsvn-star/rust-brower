name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cài dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Đóng gói
        run: |
          mkdir -p artifact
          cp target/release/aurora artifact/
          ldd artifact/aurora || true

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-linux-x64
          path: artifact/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Đóng gói
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item target/release/aurora.exe artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-x64
          path: artifact/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Đóng gói
        run: |
          mkdir -p artifact
          cp target/release/aurora artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-macos-arm64
          path: artifact/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: bins
      - uses: softprops/action-gh-release@v2
        with:
          files: bins/*
          generate_release_notes: true
