name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            bin: aurora
            ext: tar.gz
          - name: windows-x64
            os: windows-latest
            bin: aurora.exe
            ext: zip
          - name: macos-arm64
            os: macos-latest
            bin: aurora
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Đóng gói (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/aurora
          cp target/release/${{ matrix.bin }} dist/aurora/
          tar -C dist -czf aurora-${{ matrix.name }}.tar.gz aurora

      - name: Đóng gói (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/aurora | Out-Null
          Copy-Item target/release/${{ matrix.bin }} dist/aurora/
          Compress-Archive -Path dist/aurora -DestinationPath aurora-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.name }}
          path: aurora-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Phát hành
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
